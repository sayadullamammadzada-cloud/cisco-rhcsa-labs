hostname R1
!
! --- VTY girişini məhdudlaşdır (standart ACL) ---
access-list 10 remark ALLOW-EMPLOYEES-VTY
access-list 10 permit 192.168.10.0 0.0.0.255
access-list 10 deny any log
!
line vty 0 4
 access-class 10 in
 transport input ssh
 login local
!
! --- Qonaq trafiki (genişləndirilmiş adlı ACL) ---
ip access-list extended GUEST_IN
 remark Daxili serveri blokla
 deny   ip 192.168.20.0 0.0.0.255 host 172.16.1.10
 deny   ip 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255
 permit udp 192.168.20.0 0.0.0.255 any eq domain
 permit tcp 192.168.20.0 0.0.0.255 any eq www
 permit tcp 192.168.20.0 0.0.0.255 any eq 443
 deny   ip any any log
!
! --- İşçilərin serverə girişi ---
ip access-list extended EMP_TO_SERVER
 permit tcp 192.168.10.0 0.0.0.255 host 172.16.1.10 eq www
 permit tcp 192.168.10.0 0.0.0.255 host 172.16.1.10 eq 443
 permit tcp 192.168.10.0 0.0.0.255 host 172.16.1.10 range 20 21
 deny   ip any host 172.16.1.10
 permit ip any any
!
interface GigabitEthernet0/0.10
 ip access-group EMP_TO_SERVER in
interface GigabitEthernet0/0.20
 ip access-group GUEST_IN in
end
